<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 스마트 가계부</title>
    
    <!-- [PWA 설정] 앱 전용 메타 태그 & 매니페스트 연동 -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="스마트 가계부">
    
    <!-- PWA Manifest Data URL -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"나의 스마트 가계부","short_name":"가계부","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2382/2382461.png","sizes":"512x512","type":"image/png"}]}'>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex justify-center p-4 sm:p-6 text-slate-800 select-none">

    <!-- 메인 카드 컨테이너 -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-sm border border-slate-100 p-6 flex flex-col gap-5 h-fit min-h-[680px]">
        
        <!-- 상단 탭 네비게이션 -->
        <div class="flex bg-slate-100 p-1 rounded-2xl">
            <button id="tabBtnLedger" onclick="switchTab('ledger')" 
                    class="flex-1 py-2 text-xs font-bold rounded-xl bg-white shadow-sm text-slate-900 transition flex items-center justify-center gap-1">
                📝 가계부
            </button>
            <button id="tabBtnCalendar" onclick="switchTab('calendar')" 
                    class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 transition flex items-center justify-center gap-1">
                📅 달력 보기
            </button>
        </div>

        <!-- ==================== 1. 가계부 탭 영역 ==================== -->
        <div id="tabLedger" class="flex flex-col gap-6">
            <!-- 상단 헤더 & 자산 요약 -->
            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <h1 class="text-lg font-bold tracking-tight text-slate-900">가계부</h1>
                    <button onclick="openBudgetModal()" class="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-xl transition">
                        ⚙️ 예산 설정
                    </button>
                </div>
                
                <div class="p-5 bg-slate-900 text-white rounded-2xl shadow-inner flex flex-col gap-4">
                    <div>
                        <span class="text-xs font-medium text-slate-400">이번 달 순 잔액</span>
                        <div class="text-3xl font-extrabold tracking-tight mt-0.5">
                            <span id="balanceAmount">0</span><span class="text-xl font-normal ml-1">원</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 border-t border-slate-800 pt-3">
                        <div>
                            <span class="text-xs text-slate-400">총 수입</span>
                            <div class="text-sm font-semibold text-emerald-400 mt-0.5">+<span id="totalIncome">0</span>원</div>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400">총 지출</span>
                            <div class="text-sm font-semibold text-rose-400 mt-0.5">-<span id="totalExpense">0</span>원</div>
                        </div>
                    </div>

                    <!-- 예산 경고 바 -->
                    <div class="flex flex-col gap-1.5 pt-2 border-t border-slate-800">
                        <div class="flex justify-between text-xs">
                            <span class="text-slate-400">예산 사용률 (<span id="budgetPercent">0</span>%)</span>
                            <span class="text-slate-300"><span id="currentExpenseText">0</span> / <span id="budgetText">500,000</span>원</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="budgetBar" class="bg-indigo-500 h-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 차트 영역 -->
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col items-center">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 self-start">지출 카테고리 분석</span>
                <div class="w-44 h-44 relative">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- 메인 입력 폼 영역 -->
            <div class="flex flex-col gap-3">
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="btnExpense" onclick="setType('expense')" 
                            class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-900 transition">지출</button>
                    <button id="btnIncome" onclick="setType('income')" 
                            class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-500 transition">수입</button>
                </div>
                
                <div class="grid grid-cols-3 gap-2">
                    <select id="categorySelect" class="col-span-1 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:border-slate-400 transition">
                    </select>
                    <input type="date" id="dateInput" 
                           class="col-span-2 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:border-slate-400 transition">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <input type="number" id="amountInput" placeholder="금액 (원)" 
                           class="col-span-1 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400 transition">
                    <input type="text" id="memoInput" placeholder="내용 입력 (예: 점심 식사)" 
                           class="col-span-2 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400 transition">
                </div>

                <button onclick="addLog()" 
                        class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm py-3 rounded-xl transition shadow-sm active:scale-95">
                    내역 추가하기
                </button>
            </div>

            <!-- 내역 리스트 및 검색 -->
            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">전체 내역</span>
                    <span id="logCount" class="text-xs text-slate-400">0건</span>
                </div>
                
                <input type="text" id="searchInput" oninput="render()" placeholder="🔍 내용 또는 카테고리 검색..." 
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-slate-400 transition">

                <ul id="logList" class="divide-y divide-slate-100 max-h-60 overflow-y-auto pr-1">
                </ul>
            </div>
        </div>

        <!-- ==================== 2. 달력 탭 영역 ==================== -->
        <div id="tabCalendar" class="flex flex-col gap-4 hidden">
            <div class="flex justify-between items-center py-2">
                <button onclick="changeMonth(-1)" class="p-2 rounded-xl hover:bg-slate-100 transition font-bold text-slate-600">◀</button>
                <h2 id="calendarMonthTitle" class="text-base font-bold text-slate-800">2026년 11월</h2>
                <button onclick="changeMonth(1)" class="p-2 rounded-xl hover:bg-slate-100 transition font-bold text-slate-600">▶</button>
            </div>

            <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 py-1 border-b border-slate-100">
                <span class="text-rose-500">일</span>
                <span>월</span>
                <span>화</span>
                <span>수</span>
                <span>목</span>
                <span>금</span>
                <span class="text-indigo-500">토</span>
            </div>

            <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs">
            </div>
        </div>

    </div>

    <!-- 상세 내역 및 추가 모달 -->
    <div id="dateModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 flex flex-col gap-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 id="modalDateTitle" class="font-bold text-slate-800 text-sm">2026-11-07 내역</h3>
                <button onclick="closeDateModal()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
            </div>

            <ul id="modalLogList" class="divide-y divide-slate-100 max-h-36 overflow-y-auto pr-1">
            </ul>

            <div class="flex flex-col gap-2 pt-3 border-t border-slate-100">
                <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">새 내역 추가</span>
                
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="modalBtnExpense" onclick="setModalType('expense')" 
                            class="flex-1 py-1 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-900 transition">지출</button>
                    <button id="modalBtnIncome" onclick="setModalType('income')" 
                            class="flex-1 py-1 text-xs font-semibold rounded-lg text-slate-500 transition">수입</button>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <select id="modalCategorySelect" class="col-span-1 px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-slate-400 transition">
                    </select>
                    <input type="number" id="modalAmountInput" placeholder="금액 (원)" 
                           class="col-span-2 px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-slate-400 transition">
                </div>

                <div class="flex gap-2">
                    <input type="text" id="modalMemoInput" placeholder="내용 입력" 
                           class="flex-1 px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-slate-400 transition">
                    <button onclick="addModalLog()" 
                            class="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs px-4 py-2 rounded-xl transition shadow-sm active:scale-95">
                        추가
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // [PWA 설정] 서비스 워커 가상 등록 코드
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', function(e) { e.respondWith(fetch(e.request)); });`;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        let logs = JSON.parse(localStorage.getItem('my_ledger_logs')) || [];
        let monthlyBudget = parseInt(localStorage.getItem('my_ledger_budget')) || 500000;
        let currentType = 'expense';
        let modalCurrentType = 'expense';
        let selectedModalDate = '';
        let chart = null;

        let calendarDate = new Date();

        const categories = {
            expense: ['🍔 식비', '🚗 교통', '🛍️ 쇼핑', '🎬 문화', '💡 기타'],
            income: ['💰 월급', '💵 용돈', '📈 부수입', '💡 기타']
        };

        document.getElementById('dateInput').valueAsDate = new Date();

        initChart();
        updateCategoryOptions();
        updateModalCategoryOptions();
        render();

        function switchTab(tabName) {
            const tabLedger = document.getElementById('tabLedger');
            const tabCalendar = document.getElementById('tabCalendar');
            const btnLedger = document.getElementById('tabBtnLedger');
            const btnCalendar = document.getElementById('tabBtnCalendar');

            if (tabName === 'ledger') {
                tabLedger.classList.remove('hidden');
                tabCalendar.classList.add('hidden');
                btnLedger.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-white shadow-sm text-slate-900 transition flex items-center justify-center gap-1";
                btnCalendar.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 transition flex items-center justify-center gap-1";
            } else {
                tabCalendar.classList.remove('hidden');
                tabLedger.classList.add('hidden');
                btnCalendar.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-white shadow-sm text-slate-900 transition flex items-center justify-center gap-1";
                btnLedger.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 transition flex items-center justify-center gap-1";
                renderCalendar();
            }
        }

        function setType(type) {
            currentType = type;
            const btnExpense = document.getElementById('btnExpense');
            const btnIncome = document.getElementById('btnIncome');

            if (type === 'expense') {
                btnExpense.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-900 transition";
                btnIncome.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-500 transition";
            } else {
                btnIncome.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-900 transition";
                btnExpense.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-500 transition";
            }
            updateCategoryOptions();
        }

        function setModalType(type) {
            modalCurrentType = type;
            const btnExpense = document.getElementById('modalBtnExpense');
            const btnIncome = document.getElementById('modalBtnIncome');

            if (type === 'expense') {
                btnExpense.className = "flex-1 py-1 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-900 transition";
                btnIncome.className = "flex-1 py-1 text-xs font-semibold rounded-lg text-slate-500 transition";
            } else {
                btnIncome.className = "flex-1 py-1 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-900 transition";
                btnExpense.className = "flex-1 py-1 text-xs font-semibold rounded-lg text-slate-500 transition";
            }
            updateModalCategoryOptions();
        }

        function updateCategoryOptions() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = "";
            categories[currentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.split(' ')[1] || cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function updateModalCategoryOptions() {
            const select = document.getElementById('modalCategorySelect');
            select.innerHTML = "";
            categories[modalCurrentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.split(' ')[1] || cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function initChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: ['#f87171', '#60a5fa', '#fbbf24', '#a78bfa', '#9ca3af'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    cutout: '70%'
                }
            });
        }

        function addLog() {
            const date = document.getElementById('dateInput').value;
            const category = document.getElementById('categorySelect').value;
            const amountInput = document.getElementById('amountInput');
            const memoInput = document.getElementById('memoInput');

            const amount = parseInt(amountInput.value);
            const memo = memoInput.value.trim() || category;

            if (!date) {
                alert("날짜를 선택해 주세요!");
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                alert("올바른 금액을 입력해 주세요!");
                return;
            }

            const newLog = {
                id: Date.now(),
                date: date,
                type: currentType,
                category: category,
                memo: memo,
                amount: amount
            };

            logs.unshift(newLog);
            saveAndRender();

            amountInput.value = "";
            memoInput.value = "";
            document.getElementById('dateInput').valueAsDate = new Date();
        }

        function addModalLog() {
            const category = document.getElementById('modalCategorySelect').value;
            const amountInput = document.getElementById('modalAmountInput');
            const memoInput = document.getElementById('modalMemoInput');

            const amount = parseInt(amountInput.value);
            const memo = memoInput.value.trim() || category;

            if (isNaN(amount) || amount <= 0) {
                alert("올바른 금액을 입력해 주세요!");
                return;
            }

            const newLog = {
                id: Date.now(),
                date: selectedModalDate,
                type: modalCurrentType,
                category: category,
                memo: memo,
                amount: amount
            };

            logs.unshift(newLog);
            saveAndRender();

            amountInput.value = "";
            memoInput.value = "";
            renderModalLogList();
        }

        function deleteLog(id) {
            logs = logs.filter(item => item.id !== id);
            saveAndRender();
            if (!document.getElementById('dateModal').classList.contains('hidden')) {
                renderModalLogList();
            }
        }

        function openBudgetModal() {
            const newBudget = prompt("이번 달 목표 예산을 입력해 주세요 (원):", monthlyBudget);
            if (newBudget !== null) {
                const parsed = parseInt(newBudget);
                if (!isNaN(parsed) && parsed >= 0) {
                    monthlyBudget = parsed;
                    localStorage.setItem('my_ledger_budget', monthlyBudget);
                    render();
                } else {
                    alert("올바른 숫자를 입력해 주세요!");
                }
            }
        }

        function saveAndRender() {
            localStorage.setItem('my_ledger_logs', JSON.stringify(logs));
            render();
            renderCalendar();
        }

        function render() {
            const list = document.getElementById('logList');
            const balanceEl = document.getElementById('balanceAmount');
            const incomeEl = document.getElementById('totalIncome');
            const expenseEl = document.getElementById('totalExpense');
            const countEl = document.getElementById('logCount');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            list.innerHTML = "";
            
            let totalIncome = 0;
            let totalExpense = 0;
            const categoryTotals = {};

            const filteredLogs = logs.filter(item => {
                const matchMemo = item.memo.toLowerCase().includes(searchQuery);
                const matchCategory = item.category.toLowerCase().includes(searchQuery);
                return matchMemo || matchCategory;
            });

            logs.forEach(item => {
                const itemType = item.type || 'expense';
                if (itemType === 'income') {
                    totalIncome += item.amount;
                } else {
                    totalExpense += item.amount;
                    categoryTotals[item.category] = (categoryTotals[item.category] || 0) + item.amount;
                }
            });

            filteredLogs.forEach(item => {
                const itemType = item.type || 'expense';
                const isIncome = itemType === 'income';
                const amountClass = isIncome ? 'text-emerald-600 font-semibold' : 'text-slate-900 font-semibold';
                const prefix = isIncome ? '+' : '-';

                const li = document.createElement('li');
                li.className = "py-3 flex justify-between items-center text-sm group";
                li.innerHTML = `
                    <div class="flex flex-col gap-0.5">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 ${isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-600'} rounded-md text-[10px] font-semibold">${item.category}</span>
                            <span class="font-medium text-slate-700">${item.memo}</span>
                        </div>
                        <span class="text-[10px] text-slate-400">${item.date}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="${amountClass}">${prefix}${item.amount.toLocaleString()}원</span>
                        <button onclick="deleteLog(${item.id})" class="text-slate-300 hover:text-red-500 transition font-bold px-1 text-xs">✕</button>
                    </div>
                `;
                list.appendChild(li);
            });

            const balance = totalIncome - totalExpense;
            balanceEl.textContent = balance.toLocaleString();
            incomeEl.textContent = totalIncome.toLocaleString();
            expenseEl.textContent = totalExpense.toLocaleString();
            countEl.textContent = filteredLogs.length + "건";

            const budgetPercent = monthlyBudget > 0 ? Math.min(Math.round((totalExpense / monthlyBudget) * 100), 100) : 0;
            document.getElementById('budgetPercent').textContent = budgetPercent;
            document.getElementById('currentExpenseText').textContent = totalExpense.toLocaleString();
            document.getElementById('budgetText').textContent = monthlyBudget.toLocaleString();
            
            const budgetBar = document.getElementById('budgetBar');
            budgetBar.style.width = budgetPercent + '%';
            if (budgetPercent >= 100) {
                budgetBar.className = "bg-rose-500 h-full transition-all duration-500";
            } else if (budgetPercent >= 80) {
                budgetBar.className = "bg-amber-500 h-full transition-all duration-500";
            } else {
                budgetBar.className = "bg-indigo-500 h-full transition-all duration-500";
            }

            updateChart(categoryTotals);
        }

        function updateChart(categoryTotals) {
            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);

            chart.data.labels = labels;
            chart.data.datasets[0].data = data;
            chart.update();
        }

        function changeMonth(delta) {
            calendarDate.setMonth(calendarDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();

            document.getElementById('calendarMonthTitle').textContent = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = "";

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-16 bg-slate-50/50 rounded-xl";
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= lastDate; day++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                let dayIncome = 0;
                let dayExpense = 0;
                logs.forEach(item => {
                    if (item.date === dateKey) {
                        if (item.type === 'income') dayIncome += item.amount;
                        else dayExpense += item.amount;
                    }
                });

                const cell = document.createElement('div');
                cell.onclick = () => openDateModal(dateKey);
                cell.className = "h-16 p-1 border border-slate-100 rounded-xl bg-white hover:border-slate-300 transition flex flex-col justify-between cursor-pointer";
                
                let contentHTML = `<span class="font-bold text-[11px] text-slate-700 text-left pl-0.5">${day}</span>`;
                
                contentHTML += `<div class="flex flex-col gap-0.5 items-end text-[9px] font-medium leading-none">`;
                if (dayIncome > 0) {
                    contentHTML += `<span class="text-emerald-600">+${(dayIncome/10000).toFixed(dayIncome >= 10000 ? 1 : 0)}만</span>`;
                }
                if (dayExpense > 0) {
                    contentHTML += `<span class="text-rose-500">-${(dayExpense/10000).toFixed(dayExpense >= 10000 ? 1 : 0)}만</span>`;
                }
                contentHTML += `</div>`;

                cell.innerHTML = contentHTML;
                grid.appendChild(cell);
            }
        }

        function openDateModal(dateKey) {
            selectedModalDate = dateKey;
            document.getElementById('modalDateTitle').textContent = `${dateKey} 내역 및 추가`;
            renderModalLogList();
            document.getElementById('dateModal').classList.remove('hidden');
        }

        function renderModalLogList() {
            const list = document.getElementById('modalLogList');
            list.innerHTML = "";

            const dayLogs = logs.filter(item => item.date === selectedModalDate);

            if (dayLogs.length === 0) {
                list.innerHTML = `<li class="py-4 text-center text-xs text-slate-400">등록된 내역이 없습니다.</li>`;
            } else {
                dayLogs.forEach(item => {
                    const isIncome = item.type === 'income';
                    const li = document.createElement('li');
                    li.className = "py-2 flex justify-between items-center text-xs";
                    li.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="px-1.5 py-0.5 ${isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-600'} rounded text-[10px]">${item.category}</span>
                            <span class="font-medium text-slate-700">${item.memo}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="${isIncome ? 'text-emerald-600 font-semibold' : 'text-slate-900 font-semibold'}">${isIncome ? '+' : '-'}${item.amount.toLocaleString()}원</span>
                            <button onclick="deleteLog(${item.id})" class="text-slate-300 hover:text-red-500 font-bold text-xs">✕</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }
        }

        function closeDateModal() {
            document.getElementById('dateModal').classList.add('hidden');
        }
    </script>
